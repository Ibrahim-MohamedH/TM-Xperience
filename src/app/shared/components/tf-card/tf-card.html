<div
  class="bg-surface border border-border rounded-2xl overflow-hidden shadow-soft hover:-translate-y-0.5 transition-all duration-200 animate-slide-up"
>
@if(hasHeader()){
  <div class="p-2 px-4 border-b" [class]="headerClass()">
    <ng-content select="[card-header]"></ng-content>
  </div>
}

  <div class="p-5" [class]="bodyClass()">
    <ng-content></ng-content>
  </div>

  @if(hasFooter()){
    <div class="p-2 border-t" [class]="footerClass()">
      <ng-content select="[card-footer]"></ng-content>
    </div>
  }
</div>
