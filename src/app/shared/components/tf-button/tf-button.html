<button
  [attr.type]="type()"
  class="relative overflow-hidden cursor-pointer mb-3.5 w-full hover:-translate-y-0.5
inline-flex justify-center items-center gap-1 text-sm font-semibold rounded-xl
px-4 py-2.5 shadow-soft transition-all duration-200
{{ loading() ? 'opacity-70 cursor-progress' : '' }}
{{ computedClasses() }}
"
  [disabled]="disabled()"
>
  @if (!loading() && icon() && iconPosition() == 'start') {
    <span
      [innerHTML]="appService.getIcon(icon())"
      [class]="iconClass()"
      [style]="iconStyle()"
    ></span>
  }

  <span class="{{ labelClass() }}" [class.animate-pulse]="loading()">
    @if(loading()){
      @if(loadingText()){
        {{loadingText() | translate}}
      }@else {
        <i class="fa-solid fa-spinner animate-spin"></i>
      }
    }@else{
      {{label() | translate}}
    }
  </span>

  @if (!loading() && icon() && iconPosition() == 'end') {
    <span
      [innerHTML]="appService.getIcon(icon())"
      [class]="iconClass()"
      [style]="iconStyle()"
    ></span>
  }
</button>
